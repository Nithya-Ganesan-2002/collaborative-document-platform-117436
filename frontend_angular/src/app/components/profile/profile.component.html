<div class="profile-container" *ngIf="auth.user()">
  <h2>User Profile</h2>
  <div>
    <strong>Email:</strong> {{ auth.user()?.email }}
  </div>
  <button (click)="onLogout()">Logout</button>
</div>
<div *ngIf="!auth.user()">
  <p>Please <a routerLink="/login">login</a> to view your profile.</p>
</div>
